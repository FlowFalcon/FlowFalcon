<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">FlowFalcon flight deck</title>
  <desc id="desc">FlowFalcon builds bots, APIs, and web experiences with JavaScript.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1b2e"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <radialGradient id="radar" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#57e6d1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#57e6d1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8fb3d1" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#sky)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 292 C220 238 393 327 593 264 S974 216 1200 258" fill="none" stroke="#57e6d1" stroke-opacity="0.2" stroke-width="2"/>
  <path d="M0 306 C229 252 386 341 600 278 S973 231 1200 271" fill="none" stroke="#8fb3d1" stroke-opacity="0.08" stroke-width="1"/>

  <g transform="translate(900 178)">
    <circle r="126" fill="url(#radar)"/>
    <circle r="103" fill="none" stroke="#57e6d1" stroke-opacity="0.16"/>
    <circle r="69" fill="none" stroke="#57e6d1" stroke-opacity="0.13"/>
    <circle r="35" fill="none" stroke="#57e6d1" stroke-opacity="0.1"/>
    <path d="M-125 0H125M0-125V125" stroke="#57e6d1" stroke-opacity="0.1"/>
    <path d="M0 0L82-67" stroke="#57e6d1" stroke-opacity="0.34" stroke-width="2"/>
    <circle cx="82" cy="-67" r="4" fill="#ffbd59" filter="url(#glow)"/>

    <g fill="none" stroke="#57e6d1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-71 8 L-15-31 L-2-15 L17-55 L31-15 L72 8 L27 5 L0 42 L-27 5 Z" stroke-width="4" filter="url(#glow)"/>
      <path d="M-27 5 L0 16 L27 5 M-2-15 L0 16 L31-15" stroke-opacity="0.6" stroke-width="2"/>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="78" y="78" fill="#57e6d1" font-size="15" letter-spacing="4">FLIGHT DECK / ONLINE</text>
    <text x="74" y="159" fill="#f5f8fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="70" font-weight="750" letter-spacing="-2">FlowFalcon</text>
    <text x="79" y="205" fill="#a8bed0" font-size="21" letter-spacing="1">BOTS · APIs · WEB EXPERIENCES</text>

    <g transform="translate(78 251)" font-size="14">
      <rect width="157" height="34" rx="17" fill="#57e6d1" fill-opacity="0.1" stroke="#57e6d1" stroke-opacity="0.34"/>
      <circle cx="20" cy="17" r="4" fill="#57e6d1" filter="url(#glow)"/>
      <text x="34" y="22" fill="#d7e5ef">JAVASCRIPT</text>

      <rect x="170" width="132" height="34" rx="17" fill="#57e6d1" fill-opacity="0.1" stroke="#57e6d1" stroke-opacity="0.34"/>
      <text x="191" y="22" fill="#d7e5ef">NODE.JS</text>

      <rect x="315" width="155" height="34" rx="17" fill="#ffbd59" fill-opacity="0.09" stroke="#ffbd59" stroke-opacity="0.4"/>
      <text x="336" y="22" fill="#f4d59c">OPEN SOURCE</text>
    </g>
  </g>

  <g fill="#8fb3d1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="2">
    <text x="79" y="326">CALLSIGN FF-01</text>
    <text x="1036" y="326">INDONESIA</text>
  </g>
</svg>
